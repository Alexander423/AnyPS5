name: Develop regression

on:
  push:
    branches: [develop, 'feature/**', 'integration/**', 'testing/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++ libx11-dev libxext-dev
      - name: Windows compiler
        if: runner.os == 'Windows'
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/winlibs.zip" https://github.com/brechtsanders/winlibs_mingw/releases/download/15.2.0posix-14.0.0-ucrt-r7/winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
          7z x "$RUNNER_TEMP/winlibs.zip" -o"$RUNNER_TEMP/winlibs"
          echo "$RUNNER_TEMP/winlibs/mingw64/bin" >> "$GITHUB_PATH"
          echo 'SSL_CERT_FILE=C:/Program Files/Git/mingw64/etc/ssl/certs/ca-bundle.crt' >> "$GITHUB_ENV"
      - name: Relinker build
        run: |
          cmake -S . -B build-relinker -G Ninja -DCMAKE_BUILD_TYPE=Release -DANYPS5_RELINKER_ONLY=ON -DBUILD_TESTING=ON -DCMAKE_CXX_COMPILER=g++
          cmake --build build-relinker --parallel 2
      - name: Relinker regression
        run: ctest --test-dir build-relinker --output-on-failure --timeout 30 -j 2 --output-junit relinker.xml
      - name: Library ABI build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build --target guest_atoll_tests guest_thread_atexit_tests guest_thread_self_tests guest_signal_tests guest_signal_set_tests guest_system_configuration_tests --parallel 2
      - name: Library ABI regression
        run: ctest --test-dir build --output-on-failure -R '^(guest_atoll|guest_thread_atexit|guest_thread_self|guest_signals|guest_signal_sets|guest_system_configuration)$' --output-junit abi.xml
      - name: Linux shader regression
        if: runner.os == 'Linux'
        env:
          ANYPS5_REQUIRE_VULKAN: '1'
          GALLIUM_OVERRIDE_CPU_CAPS: avx
        run: |
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers
          cmake -S . -B build -DANYPS5_ENABLE_SPIRV_TOOLS=ON
          cmake --build build --target agc_driver_sdwa_float_selectors_tests agc_driver_sdwa_ldexp_f16_tests agc_driver_nan_quieting_tests --parallel 2
          ctest --test-dir build --output-on-failure --timeout 30 -R '^(agc_driver_sdwa_float_selectors|agc_driver_sdwa_ldexp_f16|agc_driver_nan_quieting)$' --output-junit shader.xml
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.os }}-${{ github.sha }}
          path: |
            build-relinker/relinker.xml
            build-relinker/Testing/Temporary/LastTest.log
            build/abi.xml
            build/shader.xml
            build/Testing/Temporary/LastTest.log
